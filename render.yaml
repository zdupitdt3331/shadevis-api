services:
  - type: web
    name: shadevis-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/launcher
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: shadevis-db
          property: connectionString

databases:
  - name: shadevis-db
    plan: free
    databaseName: shadevis
    user: shadevis
